apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    # Для dev (docker-compose local) — `postgres:5432`.
    # Для self-hosted EC2 (KS-1638) — RDS endpoint из .env (POSTGRES_HOST=kingside-db.xxx.rds.amazonaws.com).
    url: ${POSTGRES_HOST:-postgres}:5432
    database: ${POSTGRES_DB:-kingside}
    user: ${POSTGRES_USER:-kingside}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-kingside}
    jsonData:
      # dev → disable; RDS → require
      sslmode: ${POSTGRES_SSLMODE:-disable}
      postgresVersion: 1600
      timescaledb: false

  # KS-4690 / ADR-147 §7A.2 — CloudWatch для RDS-метрик kingside-db
  # (FreeableMemory, CPUUtilization, ReadLatency, SwapUsage). Используется
  # дашбордом «Hints & Events». Требует на IAM-роли monitoring-EC2
  # политики `CloudWatchReadOnlyAccess` (или явных `cloudwatch:GetMetricData`,
  # `cloudwatch:ListMetrics`). Креды — через инстанс-профиль EC2, без явных
  # access-key.
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      # Захардкожено: ${ENV} default-value синтаксис Grafana provisioning не
      # понимает (рендерится как литерал, health-check падает с "missing
      # default region"). Регион AWS у нас один на всю инфру.
      defaultRegion: eu-central-1
