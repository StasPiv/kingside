apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB:-kingside}
    user: ${POSTGRES_USER:-kingside}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-kingside}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
