global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: kingside
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API — ECS Service Discovery через sidecar `ecs-discovery`, который каждые
  # 60 секунд пишет /etc/prometheus/targets/kingside-api.json.
  # Важно (KS-1638 co-ordinator note): публичный ALB скрейпить нельзя —
  # counters prom-client работают per-process, ALB балансирует /api/metrics
  # между инстансами и отдаёт случайные слайсы. Поэтому скрейпим напрямую
  # по внутренним IP ENI ECS task'ов (VPC-internal, SG разрешает
  # monitoring-sg → api-sg:3001).
  - job_name: kingside-api
    scheme: http
    metrics_path: /api/metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/kingside-api.json
        refresh_interval: 30s
    relabel_configs:
      # Извлекаем короткий task_id из ARN для удобства в графиках.
      - source_labels: [task_arn]
        regex: .*/([^/]+)$
        target_label: task_id
        replacement: $1
      - source_labels: [ecs_health]
        target_label: health

  # archive-importer (KS-1674 / ADR-019): отдельный ECS service `kingside-archive-importer`,
  # один контейнер, без ALB. Scrape по внутреннему IP ENI task'а, порт 3004.
  # Sidecar `ecs-discovery-archive-importer` каждые 60 сек пишет /etc/prometheus/targets/kingside-archive-importer.json.
  # SG kingside-ecs-sg (sg-07f96fdb66b70e8eb) разрешает monitoring-sg → 3004.
  - job_name: kingside-archive-importer
    scheme: http
    metrics_path: /_/metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/kingside-archive-importer.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [task_arn]
        regex: .*/([^/]+)$
        target_label: task_id
        replacement: $1
      - source_labels: [ecs_health]
        target_label: health

  # postgres-exporter — коннектится к RDS по POSTGRES_EXPORTER_DATA_SOURCE_NAME (.env).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          db: kingside

  # alertmanager self-scrape — чтобы видеть его up/down.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
