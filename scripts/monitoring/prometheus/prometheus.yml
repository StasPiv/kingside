global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: kingside
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API — ECS Service Discovery через sidecar `ecs-discovery`, который каждые
  # 60 секунд пишет /etc/prometheus/targets/kingside-api.json.
  # Важно (KS-1638 co-ordinator note): публичный ALB скрейпить нельзя —
  # counters prom-client работают per-process, ALB балансирует /api/metrics
  # между инстансами и отдаёт случайные слайсы. Поэтому скрейпим напрямую
  # по внутренним IP ENI ECS task'ов (VPC-internal, SG разрешает
  # monitoring-sg → api-sg:3001).
  - job_name: kingside-api
    scheme: http
    metrics_path: /api/metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/kingside-api.json
        refresh_interval: 30s
    relabel_configs:
      # Извлекаем короткий task_id из ARN для удобства в графиках.
      - source_labels: [task_arn]
        regex: .*/([^/]+)$
        target_label: task_id
        replacement: $1
      - source_labels: [ecs_health]
        target_label: health

  # KS-1682 / ADR-020: archive-importer больше не long-lived ECS service, а oneshot
  # task, запускаемый EventBridge Scheduler раз в сутки. Метрики переехали на
  # CloudWatch EMF (namespace Kingside/ArchiveImporter) — Prometheus-scrape удалён.
  # Alerting через CloudWatch Alarms → SNS kingside-alerts.

  # postgres-exporter — коннектится к RDS по POSTGRES_EXPORTER_DATA_SOURCE_NAME (.env).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          db: kingside

  # alertmanager self-scrape — чтобы видеть его up/down.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
