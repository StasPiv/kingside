# Nginx configuration for Kingside on kamatera-chess
# Domain: chess-analyze.online
# Apply: sudo cp infra/nginx/kingside.conf /etc/nginx/sites-available/kingside
#        sudo ln -sf /etc/nginx/sites-available/kingside /etc/nginx/sites-enabled/kingside
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name chess-analyze.online www.chess-analyze.online;

    # Redirect HTTP to HTTPS
    return 301 https://chess-analyze.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chess-analyze.online www.chess-analyze.online;

    # SSL — Let's Encrypt (certbot --nginx -d chess-analyze.online -d www.chess-analyze.online)
    ssl_certificate     /etc/letsencrypt/live/chess-analyze.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess-analyze.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/kingside;

    # Required for Stockfish WASM SharedArrayBuffer
    # credentialless allows cross-origin iframes (Telegram widget) while preserving SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # API proxy
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (socket.io) proxy
    location /socket.io/ {
        proxy_pass         http://localhost:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Jira webhook proxy (SSH reverse tunnel kamatera:9877 -> local:9876)
    location /webhook/jira {
        proxy_pass         http://127.0.0.1:9877;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # HTML files — no caching (users always get fresh version after deploy)
    location ~* \.html$ {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache static assets with content hash (immutable, 1 year)
    location ~* \.(js|css|png|svg|ico|woff2|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Frontend SPA — non-file requests get index.html via rewrite
    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA fallback — serve index.html with no-cache headers
    location @spa {
        rewrite ^ /index.html break;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
