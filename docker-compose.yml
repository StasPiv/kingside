services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kingside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kingside}
      POSTGRES_DB: ${POSTGRES_DB:-kingside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # KS-1744: init-скрипты выполняются при первом старте (пустой volume).
      # 01-create-broadcasts-db.sh создаёт БД broadcasts_kingside рядом с основной.
      # Если postgres volume уже был — создай БД вручную (см. комментарий в скрипте).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli set _healthcheck 1 EX 10 | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "${PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3001/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "kingside-api"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/${POSTGRES_DB:-kingside}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
      STOCKFISH_MAX_INSTANCES: ${STOCKFISH_MAX_INSTANCES:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      # Facebook OAuth
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3001/api/auth/facebook/callback}
      # Telegram OAuth
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # KS-1973: whitelist email'ов с доступом к /lessons/admin/* (AdminEmailGuard).
      # CSV, регистронезависимо. `*` = разрешить всем (только для тестов).
      # Пусто = запрет всем. См. docs/devops/lesson-admin-emails.md.
      LESSON_ADMIN_EMAILS: ${LESSON_ADMIN_EMAILS:-staspivovartsev@gmail.com}
      # KS-2199: dev-bypass аутентификация. Значение по умолчанию совпадает с тем,
      # что фронтенд передаёт в ?dev_bypass=secret. В prod переопределить или убрать.
      DEV_BYPASS_SECRET: ${DEV_BYPASS_SECRET:-secret}
    depends_on:
      - postgres
      - redis

  api-green:
    image: kingside-api
    restart: "no"
    mem_limit: 400m
    ports:
      - "3002:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3001/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "kingside-api-green"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/${POSTGRES_DB:-kingside}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
      STOCKFISH_MAX_INSTANCES: ${STOCKFISH_MAX_INSTANCES:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3001/api/auth/facebook/callback}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # KS-1973: см. секцию api выше.
      LESSON_ADMIN_EMAILS: ${LESSON_ADMIN_EMAILS:-staspivovartsev@gmail.com}
      # KS-2199: см. секцию api выше.
      DEV_BYPASS_SECRET: ${DEV_BYPASS_SECRET:-secret}
    depends_on:
      - postgres
      - redis
    profiles:
      - deploy

  # KS-2760: одноразовая настройка postgres_fdw для локальной main БД `kingside`
  # с foreign table `archive_games_remote` в `kingside_archive`, плюс индексы
  # (white_elo)/(black_elo) на archive-стороне. Идемпотентно.
  # Запуск:
  #   docker compose --profile fdw-setup up fdw-setup-local
  fdw-setup-local:
    image: postgres:16-alpine
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-kingside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kingside}
    volumes:
      - ./scripts/sql:/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until pg_isready -q; do sleep 1; done
        echo "=== applying setup-fdw-local.sql on ${POSTGRES_DB:-kingside} ==="
        psql -d "${POSTGRES_DB:-kingside}" -v ON_ERROR_STOP=1 -f /sql/setup-fdw-local.sql
        echo "=== applying setup-fdw-archive-indexes.sql on kingside_archive ==="
        psql -d kingside_archive -v ON_ERROR_STOP=1 -f /sql/setup-fdw-archive-indexes.sql
        echo "=== verify pushdown on ${POSTGRES_DB:-kingside} ==="
        psql -d "${POSTGRES_DB:-kingside}" -v ON_ERROR_STOP=1 -f /sql/verify-fdw-local.sql
        echo "=== fdw-setup-local done ==="
    restart: "no"
    profiles:
      - fdw-setup

  # KS-1744: одноразовая инициализация broadcasts_kingside для случаев, когда
  # postgres volume уже существует (init-скрипт /docker-entrypoint-initdb.d
  # не выполняется повторно). Вызывается вручную:
  #   docker compose --profile init run --rm broadcasts-db-init
  broadcasts-db-init:
    image: postgres:16-alpine
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-kingside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kingside}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_isready -q; do sleep 1; done
        psql -d postgres -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname='broadcasts_kingside'" | grep -q 1 \
          || psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE broadcasts_kingside OWNER $$PGUSER"
        echo "broadcasts_kingside ready"
    restart: "no"
    profiles:
      - init

  puzzle-import:
    image: kingside-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/${POSTGRES_DB:-kingside}
      IMPORT_BATCH_SIZE: "5000"
    volumes:
      - ./scripts/.tmp/lichess.csv.zst:/tmp/lichess.csv.zst:ro
    working_dir: /app/apps/api
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "=== ls dist/puzzle ==="
        ls /app/apps/api/dist/puzzle 2>&1 || true
        echo "=== ls dist (top) ==="
        ls /app/apps/api/dist 2>&1 || true
        echo "=== find import-puzzles ==="
        find /app -name 'import-puzzles*' 2>/dev/null || true
    restart: "no"
    profiles:
      - puzzle-import

  # KS-1918: одноразовая миграция broadcasts_kingside для локали.
  # Запуск: docker compose --profile migrate up broadcasts-migrate
  # KS-3924: лёгкий migration-образ для api. Используется в проде через
  # Fargate run-task (см. scripts/deploy-aws.sh, kingside-api-migrate task-def).
  # Локально — только для проверки сборки (`docker compose build api-migrations`).
  # Профиль `migrate` исключает сервис из дефолтного `compose up`.
  api-migrations:
    image: kingside-api-migrations:local
    build:
      context: .
      dockerfile: scripts/Dockerfile.migrations
    restart: "no"
    profiles:
      - migrate

  broadcasts-migrate:
    image: kingside-broadcast-service:latest
    restart: "no"
    depends_on:
      - postgres
    environment:
      BROADCASTS_DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/broadcasts_kingside
    working_dir: /app/packages/broadcasts-db
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U ${POSTGRES_USER:-kingside} >/dev/null 2>&1 || node -e "process.exit(0)"; do sleep 1; done
        npx prisma migrate deploy --schema=./prisma/schema.prisma
    profiles:
      - migrate

  # KS-1918 (frontend local dev): broadcast-service на порту 3004.
  # Тот же образ что в AWS ECS (kingside-broadcast-service). БД broadcasts_kingside
  # должна существовать (profile 'init' + broadcasts-db-init). Миграции Prisma
  # нужно накатывать отдельно: см. раздел "Миграции broadcasts-db" ниже в README/CLAUDE.md.
  broadcast-service:
    build:
      context: .
      dockerfile: apps/broadcast-service/Dockerfile
    image: kingside-broadcast-service:latest
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "${BROADCAST_SERVICE_PORT:-3004}:3004"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3004/_/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "kingside-broadcast-service"
    environment:
      BROADCASTS_DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/broadcasts_kingside
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      PORT: 3004
      BROADCAST_SERVICE_PORT: 3004
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
      # Локально sync-цикл выключен, чтобы не дёргать chess-results/lichess. Включить через env.
      BROADCAST_SYNC_ENABLED: ${BROADCAST_SYNC_ENABLED:-false}
      BROADCAST_PINNED_UPCOMING_HOURS: "48"
      BROADCAST_PINNED_MIN_GAMES: "4"
      BROADCAST_PINNED_MIN_ELO: "2500"
      BROADCAST_STALE_CYCLES: "72"
      CHESS_RESULTS_BASE_URL: https://chess-results.com
      CHESS_RESULTS_USER_AGENT: "Kingside/1.0 (local dev; staspivovartsev@gmail.com)"
      WS_USE_REDIS_ADAPTER: auto
      LICHESS_BROADCAST_IDS: ${LICHESS_BROADCAST_IDS:-}
    depends_on:
      - postgres
      - redis

  archive-importer:
    # ADR-019 / KS-1674/1676/1677: importer — второй CMD единого образа archive-service.
    # Сервис называется archive-importer по историческим причинам (ECS service name = kingside-archive-importer).
    # Локально запускается только по запросу: --profile archive. Иначе занимает порт 3004 и конфликтует с broadcast-service (KS-1918).
    build:
      context: .
      dockerfile: apps/archive-service/Dockerfile
    image: kingside-archive-service:latest
    # KS-2698: --max-old-space-size=768 — поднимаем V8 heap до 768 МБ.
    # 256 МБ дефолта не хватает на парсинг TWIC zip (~10–30 МБ архив,
    # десятки тысяч PGN-партий + индексация позиций) — падало с
    # FatalProcessOutOfMemory. В проде importer-once запускается на
    # Fargate с 2 ГБ памяти, локально хватит 1 ГБ.
    command: ["node", "--max-old-space-size=768", "dist/importer-main.js"]
    restart: unless-stopped
    mem_limit: 1024m
    profiles:
      - archive
    # KS-2698: ports маппинг убран, чтобы локально не конфликтовать с
    # broadcast-service (тоже на 3004). Внутри docker-network healthcheck
    # на localhost:3004 работает; наружу импортер прикладной интерфейс
    # не публикует — он наполняет БД, потребители читают через
    # ARCHIVE_DATABASE_URL.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3004/_/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "kingside-archive-importer"
    environment:
      # KS-2698: importer пишет в отдельную БД kingside_archive (как в проде —
      # `archive_kingside`, ADR-018 §2.2). Раньше указывало на `${POSTGRES_DB}`
      # (kingside) — но это конфликтовало с _prisma_migrations основной БД и
      # создавало drift. Теперь archive-таблицы изолированы.
      ARCHIVE_DATABASE_URL: postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/${ARCHIVE_POSTGRES_DB:-kingside_archive}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-production}
      ARCHIVE_IMPORTER_PORT: 3004
      TWIC_BASE_URL: ${TWIC_BASE_URL:-https://theweekinchess.com/zips}
    depends_on:
      - postgres
      - redis

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - logging

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kingside}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Проброс для datasource provisioning (Postgres datasource использует эти переменные)
      POSTGRES_DB: ${POSTGRES_DB:-kingside}
      POSTGRES_USER: ${POSTGRES_USER:-kingside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kingside}
    volumes:
      - ./scripts/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    profiles:
      - logging
      - monitoring

  # --- Monitoring (KS-1635 / ADR-016 Этап 6) ---

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./scripts/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./scripts/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - postgres-exporter
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    volumes:
      - ./scripts/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    # Alertmanager не умеет envsubst — шаблон рендерится на старте через sed.
    # Плейсхолдеры __TELEGRAM_BOT_TOKEN__ / __TELEGRAM_CHAT_ID__ заменяются значениями из env.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        sed \
          -e "s|__TELEGRAM_BOT_TOKEN__|${TELEGRAM_BOT_TOKEN:-}|g" \
          -e "s|__TELEGRAM_CHAT_ID__|${TELEGRAM_CHAT_ID:-0}|g" \
          /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.listen-address=:9093
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-kingside}:${POSTGRES_PASSWORD:-kingside}@postgres:5432/${POSTGRES_DB:-kingside}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./scripts/monitoring/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:
