name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: kingside
  POSTGRES_PASSWORD: kingside
  POSTGRES_DB: kingside
  DATABASE_URL: postgresql://kingside:kingside@localhost:5432/kingside
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: e2e-test-secret

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kingside
          POSTGRES_PASSWORD: kingside
          POSTGRES_DB: kingside
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @kingside/api

      - name: Run database migrations
        run: npx -w apps/api prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx -w apps/e2e playwright install --with-deps chromium

      - name: Start API server
        run: npm run start -w @kingside/api &
        env:
          NODE_ENV: test

      - name: Start web server
        run: npx -w apps/web vite preview --port 5173 &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3000 http://localhost:5173 --timeout 30000

      - name: Run E2E tests
        run: npm run test -w @kingside/e2e -- --project=chromium
        env:
          CI: true
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
