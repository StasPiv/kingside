<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Play chess online for free. Analyze games, solve puzzles, compete in tournaments. No registration required." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kingside — Play Chess Online" />
    <meta property="og:description" content="Play chess online for free. Analyze games with Stockfish, solve puzzles, compete in tournaments." />
    <meta property="og:image" content="https://kingside.site/og-image.png" />
    <meta property="og:url" content="https://kingside.site" />
    <meta property="og:site_name" content="Kingside" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kingside — Play Chess Online" />
    <meta name="twitter:description" content="Play chess online for free. Analyze games, solve puzzles, compete in tournaments." />
    <meta name="twitter:image" content="https://kingside.site/og-image.png" />

    <title>Kingside</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- KS-3237: PWA-иконки для Add-to-Home-Screen.
         - apple-touch-icon: 180×180 PNG для iOS Safari «На экран Домой».
           iOS не читает manifest.icons; обязательная отдельная ссылка.
         - link rel="icon" 192/512: некоторые Android-лаунчеры (Pixel,
           Samsung) при отсутствии установленной PWA берут icon-link
           по `sizes`. Канонический набор — в manifest.webmanifest
           (генерируется vite-plugin-pwa, см. vite.config.ts). -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- KS-1693: Resolve theme before first paint to prevent FOUC.
         Reads localStorage.theme (set by ThemeContext), falls back to
         prefers-color-scheme. Mirror logic in src/context/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('theme'); } catch (_) {}
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kingside",
      "url": "https://kingside.site",
      "description": "Free online chess platform. Play, analyze, solve puzzles, compete in tournaments.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
