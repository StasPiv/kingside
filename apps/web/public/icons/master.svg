<!--
  KS-3241: master source for PWA raster icons (apps/web/public/icons/icon-*.png).

  ♔ (U+2654 WHITE CHESS KING) extracted as deterministic vector path
  from **Noto Sans Symbols 2 Regular** via fontTools.pens.svgPathPen.
  This is the same glyph Android Chrome (and many Linux distros via
  fonts-noto-cjk) renders for the user when they open /icon.svg — so
  the resulting PNG matches what the user actually sees on Android home
  screen / Chrome address bar / share preview.

  Font: Noto Sans Symbols 2 — SIL Open Font License 1.1.
  Source: https://github.com/googlefonts/noto-fonts (Google Fonts).

  Glyph metrics: units_per_em=1000, bbox 203..797 × -34..753.
  Transform: translate(2.65 25.6) scale(0.0267 -0.0267) — flip Y
  (font baseline-up → SVG top-down), scale to ≈21px glyph height,
  centre in viewBox 32×32.

  NOTE: основной apps/web/public/icon.svg остаётся брендовым favicon
  с `<text>♔</text>` font-family="serif" (KS-576 / KS-3240) и НЕ
  модифицируется. Этот master.svg — отдельный source-of-truth только
  для PNG-конвейера (apps/web/scripts/render-pwa-icons.cjs).
-->
