# kingside-engine-bridge configuration
# Copy to config.yaml and adjust settings

port: 9090

# Secret key for WebSocket authentication (auto-generated on first run if empty).
# IMPORTANT: Always wrap in quotes — bare hex values cause YAML parse errors.
# Copy this value to the frontend engine settings.
secret: ""

# Path to UCI chess engine binary.
# On Windows, use full path or .\stockfish.exe for a file in the same folder.
engine_path: "stockfish"
options:
  Threads: "1"
  Hash: "256"
rate_limit:
  max_per_minute: 5
  ban_after: 10
# Optional TLS (uncomment to enable)
# tls:
#   enabled: true
#   cert_file: ""  # leave empty for self-signed
#   key_file: ""
